name: Build & Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --max_old_space_size=4096

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli@18

      # The production api url lives in the EAS "production" environment.
      - name: Check the production api url
        run: |
          RAW=$(eas env:get production --variable-name EXPO_PUBLIC_API_URL --non-interactive --format short)
          URL=$(printf '%s\n' "$RAW" | sed -n 's/^EXPO_PUBLIC_API_URL=//p')
          if [ -z "$URL" ]; then
            echo "EXPO_PUBLIC_API_URL is not set in the EAS production environment." >&2
            echo "A release build embeds it at bundle time, and src/constants/config.ts" >&2
            echo "aborts at startup when it is not https, so the app would crash on open." >&2
            exit 1
          fi
          case "$URL" in
            https://*) echo "api url ok" ;;
            *)
              echo "EXPO_PUBLIC_API_URL must start with https://" >&2
              exit 1
              ;;
          esac

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Check version consistency
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: app.json=$APP_VERSION package.json=$PKG_VERSION" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.artifact }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: apk
            profile: production-apk
          - artifact: aab
            profile: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache EAS
        uses: actions/cache@v4
        with:
          path: |
            ~/.eas
            ~/.cache/eas
          key: ${{ runner.os }}-eas-${{ hashFiles('eas.json') }}
          restore-keys: |
            ${{ runner.os }}-eas-

      - name: Install dependencies
        run: |
          NODE_ENV=development npm ci
          npm install -g eas-cli@18

      - name: Verify EAS authentication
        run: |
          eas --version
          eas whoami

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> $GITHUB_OUTPUT

      # The build profiles also load this from EAS; exporting it keeps the value
      # in the process env for the local build as well.
      - name: Load the api url from EAS
        run: |
          RAW=$(eas env:get production --variable-name EXPO_PUBLIC_API_URL --non-interactive --format short)
          URL=$(printf '%s\n' "$RAW" | sed -n 's/^EXPO_PUBLIC_API_URL=//p')
          if [ -n "$URL" ]; then
            echo "EXPO_PUBLIC_API_URL=$URL" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          eas build \
            --platform android \
            --profile ${{ matrix.profile }} \
            --local \
            --non-interactive \
            --output=./pinolrent-${{ steps.ver.outputs.version }}.${{ matrix.artifact }}
          ls -la ./pinolrent-*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinolrent-${{ matrix.artifact }}
          path: ./pinolrent-${{ steps.ver.outputs.version }}.${{ matrix.artifact }}
          retention-days: 30

  create-release:
    name: create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The changelog reads the last commits, and the default checkout is
          # a single commit deep.
          fetch-depth: 0

      - name: Generate build information
        id: build-info
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" -n 10 > changelog.md
          printf "\n" >> changelog.md

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pinolrent-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "v${{ steps.build-info.outputs.version }}"
          tag_name: "v${{ steps.build-info.outputs.version }}"
          files: |
            pinolrent-${{ steps.build-info.outputs.version }}.apk
            pinolrent-${{ steps.build-info.outputs.version }}.aab
          body_path: changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
